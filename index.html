<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Wizard Is Out</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,400;0,600;1,400&family=VT323&display=swap">
<style>
/* Layout: one-screen candlelit terminal. Status strip, scrolling transcript, prompt, quick-command chips. Single committed dark look. */
:root{
  --bg:#130f16;
  --panel:#1b1520;
  --line:#3a2d40;
  --text:#e9c27c;
  --dim:#94798a;
  --hi:#fde6b8;
  --alert:#ff7d6b;
  --arcane:#8fe3c6;
  --glow:0 0 8px rgba(233,194,124,.28);
  --display:"VT323","Courier New",monospace;
  --mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  color-scheme:dark;
}
html{height:100%;box-sizing:border-box}
*,*::before,*::after{box-sizing:inherit}
body{height:100%;margin:0;background:var(--bg);color:var(--text);font-family:var(--mono);font-size:15px;line-height:1.55}
.app{height:100%;max-width:960px;margin:0 auto;display:flex;flex-direction:column;gap:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px}

.bar{display:flex;flex-direction:column;align-items:stretch;gap:10px;border-bottom:1px solid var(--line);padding-bottom:10px}
.brand{font-family:var(--display);font-size:2rem;line-height:.85;letter-spacing:.05em;color:var(--hi);text-shadow:var(--glow);text-transform:uppercase}
.brand small{display:block;font-family:var(--mono);font-size:.6rem;letter-spacing:.2em;color:var(--dim);text-shadow:none;margin-top:6px}
.stats{min-width:0;margin:0;display:grid;grid-template-columns:repeat(6,auto);justify-content:space-between;gap:4px 18px}
.stats div{min-width:0}
.stats dt{font-size:.64rem;letter-spacing:.16em;text-transform:uppercase;color:var(--dim)}
.stats dd{margin:0;font-family:var(--display);font-size:1.4rem;line-height:1.1;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
.stats dd.hot{color:var(--alert)}
.stats dd.good{color:var(--arcane)}
.meter{display:flex;gap:2px;align-items:center;height:1.54rem}
.meter i{display:block;width:7px;height:13px;background:var(--line)}
.meter.wide i{width:22px}
.meter i.on{background:var(--arcane);box-shadow:0 0 6px rgba(143,227,198,.45)}
.meter.hot i.on{background:var(--alert);box-shadow:0 0 6px rgba(255,125,107,.45)}
@media (max-width:760px){
  .stats{grid-template-columns:repeat(3,minmax(0,1fr));justify-content:stretch}
}

.screen{flex:1;min-height:0;position:relative;border:1px solid var(--line);border-radius:4px;background:var(--panel);overflow:hidden}
.screen::after{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(to bottom,transparent 0 2px,rgba(0,0,0,.14) 2px 3px),radial-gradient(ellipse at center,transparent 60%,rgba(0,0,0,.38) 100%)}
.log{position:absolute;inset:0;overflow-y:auto;padding:18px 20px 24px;display:flex;flex-direction:column;gap:10px;text-shadow:var(--glow)}
.line{flex-shrink:0;margin:0;max-width:72ch;white-space:pre-wrap;overflow-wrap:anywhere}
.line.echo{color:var(--dim);margin-top:8px;text-shadow:none}
.line.title{font-family:var(--display);font-size:clamp(2.6rem,10vw,4.4rem);line-height:.85;letter-spacing:.05em;color:var(--hi)}
.line.act{font-family:var(--display);font-size:clamp(2rem,7vw,3rem);line-height:.9;letter-spacing:.05em;text-transform:uppercase;color:var(--arcane);margin-top:18px;padding-top:14px;border-top:1px dashed var(--line);text-shadow:0 0 10px rgba(143,227,198,.35)}
.line.sub{color:var(--dim);font-style:italic;text-shadow:none}
.line.room{font-family:var(--display);font-size:1.8rem;line-height:1;letter-spacing:.05em;text-transform:uppercase;color:var(--hi);margin-top:4px}
.line.code,.line.map{max-width:100%;white-space:pre;overflow-x:auto;overflow-wrap:normal;font-size:.86rem;color:var(--hi);border-left:2px solid var(--dim);padding:2px 0 2px 12px}
.line.sys{color:var(--dim);text-shadow:none}
.line.voice{color:var(--arcane);font-style:italic;text-shadow:0 0 8px rgba(143,227,198,.3)}
.line.npc{color:var(--hi)}
.line.warn{color:var(--alert);text-shadow:0 0 8px rgba(255,125,107,.3)}
.line.pts{color:var(--arcane);font-size:.74rem;letter-spacing:.16em;text-transform:uppercase;text-shadow:none}
.line.ending{font-family:var(--display);font-size:2.3rem;line-height:1;color:var(--hi);margin-top:6px}
@media (prefers-reduced-motion:no-preference){
  .line{animation:in .18s ease-out}
  @keyframes in{from{opacity:.25}to{opacity:1}}
}

.prompt{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:4px;background:var(--panel);padding:6px 8px 6px 12px}
.prompt:focus-within{border-color:var(--dim)}
.ps{font-family:var(--display);font-size:1.4rem;color:var(--hi);text-shadow:var(--glow)}
.prompt input{flex:1;min-width:0;background:transparent;border:0;outline:none;color:var(--hi);caret-color:var(--text);font-family:var(--mono);font-size:16px;padding:6px 0}
.prompt input::placeholder{color:var(--dim);opacity:.8}
.prompt button,.chips button{font:inherit;cursor:pointer;background:transparent;color:var(--text);border:1px solid var(--line);border-radius:3px}
.prompt button{font-family:var(--display);font-size:1.15rem;letter-spacing:.08em;text-transform:uppercase;padding:2px 14px;border-color:var(--dim)}
.prompt button:hover{background:var(--text);color:var(--bg)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{font-size:.74rem;letter-spacing:.12em;text-transform:uppercase;padding:6px 11px}
.chips button:hover{border-color:var(--text);color:var(--hi)}
.chips .dir{min-width:2.4rem}
button:focus-visible{outline:2px solid var(--text);outline-offset:2px}
</style>
<style>[hidden]{display:none!important}</style>
</head>
<body>
<div class="app">
  <header class="bar">
    <div class="brand">The Wizard Is Out<small>A TEXT ADVENTURE IN FOUR ACTS OF POOR HOUSE-SITTING</small></div>
    <dl class="stats">
      <div><dt>Act</dt><dd id="st-act">I</dd></div>
      <div><dt>Location</dt><dd id="st-loc">Study</dd></div>
      <div><dt>Time</dt><dd id="st-time">Fri 22:00</dd></div>
      <div><dt>Objective</dt><dd id="st-obj" class="hot">Circle broken</dd></div>
      <div><dt id="st-meter-label">Portal</dt><dd><span class="meter" id="st-meter" role="img" aria-label="Portal 0 percent open"></span></dd></div>
      <div><dt>Score</dt><dd id="st-score">0/400</dd></div>
    </dl>
  </header>

  <main class="screen">
    <div id="log" class="log" role="log" aria-live="polite"></div>
  </main>

  <form id="cmd" class="prompt" autocomplete="off">
    <label for="cmd-input" class="ps">&gt;</label>
    <input id="cmd-input" name="cmd-input" type="text" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="Try: look at circle">
    <button type="submit">Enter</button>
  </form>

  <nav class="chips" aria-label="Quick commands">
    <button type="button" data-cmd="look">Look</button>
    <button type="button" data-cmd="inventory">Inventory</button>
    <button type="button" data-cmd="map">Map</button>
    <button type="button" class="dir" data-cmd="n">N</button>
    <button type="button" class="dir" data-cmd="s">S</button>
    <button type="button" class="dir" data-cmd="e">E</button>
    <button type="button" class="dir" data-cmd="w">W</button>
    <button type="button" data-cmd="wait">Wait</button>
    <button type="button" data-cmd="hint">Hint</button>
    <button type="button" data-cmd="help">Help</button>
  </nav>
</div>

<script>
(function(){
"use strict";
const HAS_DOM = typeof document !== "undefined";
const SAVE_KEY = "wizard-is-out-save-v2";
const NAME = "gerald";
const ROMAN = {1:"I",2:"II",3:"III",4:"IV"};
const ACTS = {
  1:{title:"Act I: The Coaster Incident", day:"Fri", start:22*60, doom:60, meter:"Portal"},
  2:{title:"Act II: The Intern",          day:"Sat", start:16*60, doom:60, meter:"Chalk"},
  3:{title:"Act III: Mother",             day:"Sun", start:11*60, doom:60, meter:"Suspicion"},
  4:{title:"Act IV: Small Claims",        day:"Mon", start:8*60,  doom:30, meter:"Hearing"}
};
const PIP_ROUTE = ["study","library","study","greenhouse","study","kitchen","study","foyer","bathroom","foyer"];

let S;
let checkpoint = null;
let buffer = [];
function say(t, cls){ buffer.push({t:String(t), cls:cls||""}); }
function clone(o){ return JSON.parse(JSON.stringify(o)); }

/* ================= world ================= */
function itemsFor(n){
  const b = {mug:null,note:null,spellbook:"study",portalbook:"library",candle:null,matches:null,opener:"drawer",tin:null,jar:null,
    salt:null,earmuffs:"foyer",root:null,chopstick:"stand",bestiary:null,fudge:null,kettle:null,lanyard:null,teapot:null,tea:null,
    nottea:null,saucepan:null,rug:null,summons:null,contract:null,quill:null,paper:null};
  if(n===1) Object.assign(b,{mug:"study",note:"study",candle:"library",matches:"drawer",tin:"pantry",jar:"fridge"});
  if(n===2) Object.assign(b,{candle:"inv",matches:"inv",bestiary:"library",kettle:"kitchen",lanyard:"bathroom"});
  if(n===3) Object.assign(b,{candle:"inv",matches:"inv",bestiary:"library",teapot:"pantry",tea:"pantry",nottea:"pantry",saucepan:"drawer",rug:"foyer",jar:S.g.ateJar?null:"fridge"});
  if(n===4) Object.assign(b,{candle:"inv",matches:"inv",bestiary:"library",summons:"inv",contract:"safe",quill:"study",paper:"study",earmuffs:null});
  return b;
}
function flagsFor(n){
  const f={scored:{}, huh:0, catTalks:0, mirrorTalks:0, npcTalks:0, candleLit:false, drawerOpen:false, pantryOpen:false, fridgeOpen:false, medOpen:false, wearing:false};
  if(n===1) Object.assign(f,{mugMoved:false,tinOpen:false,catFed:false,knowsName:false,readSpell:false,knowsRitual:false,rootTaken:false,saltDone:false,rootPlaced:false,closed:false});
  if(n===2) Object.assign(f,{readBestiary:false,fudgeFound:false,fudge:0,kettleBaited:false,pipInKettle:false,pipCaught:false,pipRoom:"study",pipStep:0,readLanyard:false,cliveAsk:false,sent:false});
  if(n===3) Object.assign(f,{stage:0,finish:0,momRoom:"kitchen",catRoom:"library",catConvinced:false,leaves:null,brewed:false,src:null,panHot:false,rugOnCircle:false,susp:0,complimented:false,earmuffWarned:false,done:false});
  if(n===4) Object.assign(f,{readSummons:false,safeFound:false,safeOpen:false,readContract:false,triplicate:false,agreement:false,catSigned:false,catRoom:"kitchen",hearing:false,hstage:0,strikes:0});
  return f;
}
function startRoom(n){ return n===3 ? "foyer" : "study"; }

const ITEMS = {
  mug:{name:"your coffee mug", aliases:["coffee mug","mug","cup","coaster"]},
  note:{name:"a note from the wizard", aliases:["wizard's note","note","letter","instructions"]},
  spellbook:{name:"the wizard's spellbook", aliases:["spellbook","spell book","grimoire","tome","big book"]},
  portalbook:{name:"a book titled PORTALS: A CAUTIONARY TALE", aliases:["portals a cautionary tale","cautionary tale","portals book","portal book","book"]},
  candle:{name:"a candle", aliases:["candle","taper","wax"]},
  matches:{name:"a box of matches", aliases:["matches","matchbox","box of matches","match"]},
  opener:{name:"a tin opener", aliases:["tin opener","can opener","opener"]},
  tin:{name:"a tin of sardines", aliases:["tin of sardines","sardines","tin","fish"]},
  jar:{name:"a jar marked NOT OLIVES", aliases:["not olives","jar","olives","pickled eyes"]},
  salt:{name:"a bag of warding salt", aliases:["bag of salt","warding salt","salt"]},
  earmuffs:{name:"a pair of earmuffs", aliases:["ear muffs","earmuffs","muffs"]},
  root:{name:"a mandrake root", aliases:["mandrake root","root"]},
  chopstick:{name:"a wand", aliases:["wand","chopstick","stick"]},
  bestiary:{name:"a bestiary", aliases:["bestiary","beast book","book of beasts","monster book"]},
  fudge:{name:()=> S.f.fudge>1 ? S.f.fudge+" squares of emergency fudge" : "a square of emergency fudge", aliases:["emergency fudge","fudge","chocolate","sweets","candy","sweet"]},
  kettle:{name:()=> S.f.pipCaught ? "the kettle (rattling, with an imp in it)" : S.f.kettleBaited ? "the cast-iron kettle (baited with fudge)" : "the cast-iron kettle", aliases:["cast iron kettle","iron kettle","kettle","lid","trap"]},
  lanyard:{name:"a tiny lanyard", aliases:["lanyard","id badge","badge","id","tag","card"]},
  teapot:{name:()=> S.f.brewed ? "the good teapot (full of tea)" : S.f.leaves ? "the good teapot (leaves in, no water)" : "the good teapot", aliases:["good teapot","teapot","tea pot"]},
  tea:{name:"a tin of tea", aliases:["tin of tea","tea tin","tea leaves","leaves","tea","tin"]},
  nottea:{name:"a tin marked NOT TEA", aliases:["tin marked not tea","not tea"]},
  saucepan:{name:"a saucepan", aliases:["saucepan","pan","water"]},
  rug:{name:"a hall rug", aliases:["hall rug","rug","runner","carpet"]},
  summons:{name:"a court summons", aliases:["court summons","summons","envelope","letter"]},
  contract:{name:()=> S.f.triplicate ? "Gerald's contract (in triplicate)" : "Gerald's contract", aliases:["soul contract","gerald's contract","contract","scroll","copies","parchment"]},
  quill:{name:"a quill", aliases:["quill","pen","feather","ink"]},
  paper:{name:()=> S.f.agreement ? (S.f.catSigned ? "the sardine agreement (signed)" : "the sardine agreement (unsigned)") : "a sheet of paper", aliases:["sardine agreement","agreement","paper","sheet","letterhead"]}
};

const catRoomFn = ()=> (S.act===3||S.act===4) ? S.f.catRoom : "kitchen";
const FIX = {
  circle:{room:"study", aliases:["summoning circle","chalk circle","circle","ring","portal","gap","glow","floor","chalk"]},
  desk:{room:"study", aliases:["desk"]},
  armchair:{room:"study", aliases:["armchair","chair"]},
  fireplace:{room:"study", aliases:["fireplace","fire","hearth","ashes","chimney"]},
  portrait:{room:"study", aliases:["portrait","painting","picture","wizard","mordrath"]},
  safe:{room:"study", acts:[4], cond:()=>S.f.safeFound, aliases:["iron safe","safe","grille"]},
  judge:{room:"study", acts:[4], cond:()=>S.f.hearing, aliases:["judge mabel","judge","mabel","toad","court","bench"]},
  xal:{room:"study", acts:[4], cond:()=>S.f.hearing, aliases:["xal'thuun","xalthuun","xal thuun","demon","accountant","plaintiff"]},
  bailiff:{room:"study", acts:[4], cond:()=>S.f.hearing, aliases:["bailiff","gargoyle"]},
  cat:{room:catRoomFn, aliases:["bartholomew","barty","cat","familiar","kitty","him"]},
  pip:{room:()=>S.f.pipRoom, acts:[2], cond:()=>!S.f.pipCaught, aliases:["pip","imp","intern","little demon"]},
  mother:{room:()=>S.f.momRoom, acts:[3], cond:()=>!S.f.done, aliases:["mrs pennywhistle","pennywhistle","gerald's mother","mother","mum","mom","her","lady","woman","hat","pheasant"]},
  fridge:{room:"kitchen", aliases:["fridge","refrigerator","icebox"]},
  pantry:{room:"kitchen", aliases:["pantry","cupboard","larder"]},
  drawer:{room:"kitchen", aliases:["kitchen drawer","drawer","drawers"]},
  stove:{room:"kitchen", aliases:["stove","oven","hob"]},
  oldkettle:{room:"kitchen", acts:[1], aliases:["kettle"]},
  bowl:{room:"kitchen", aliases:["cat bowl","bowl","dish"]},
  spices:{room:"kitchen", aliases:["spice rack","spices"]},
  stairs:{room:"kitchen", aliases:["stairs","cellar stairs","steps"]},
  shelves:{room:"library", aliases:["bookshelves","shelves","shelf","books","top shelf"]},
  readingdesk:{room:"library", aliases:["reading desk","lectern","table","lamp"]},
  ladder:{room:"library", aliases:["ladder","rolling ladder"]},
  mandrake:{room:"greenhouse", aliases:["mandrake","pot","clay pot"]},
  flytrap:{room:"greenhouse", aliases:["venus flytrap","flytrap","plants","plant"]},
  wateringcan:{room:"greenhouse", aliases:["watering can","can"]},
  rack:{room:"foyer", aliases:["coat rack","rack","hooks","coats"]},
  frontdoor:{room:"foyer", aliases:["front door","door","runes"]},
  stand:{room:"foyer", aliases:["umbrella stand","stand"]},
  mailslot:{room:"foyer", aliases:["mail slot","slot","mail","brochure"]},
  mirror:{room:"bathroom", aliases:["magic mirror","mirror"]},
  tub:{room:"bathroom", aliases:["bathtub","tub","bath","newt"]},
  medcab:{room:"bathroom", aliases:["medicine cabinet","cabinet"]},
  sacks:{room:"cellar", aliases:["salt sacks","sacks","sack","burlap"]},
  winerack:{room:"cellar", aliases:["wine rack","wine","bottles"]},
  furnace:{room:"cellar", aliases:["furnace","boiler","clive","fire elemental","elemental","voice","grate"]}
};
const ALL = Object.keys(ITEMS).concat(Object.keys(FIX));
const CROOM = {drawer:"kitchen", pantry:"kitchen", fridge:"kitchen", stand:"foyer", safe:"study"};
const CNAME = {drawer:"the drawer", pantry:"the pantry", fridge:"the fridge", stand:"the umbrella stand", safe:"the safe"};

/* ================= helpers ================= */
function A(){ return ACTS[S.act]; }
function clock(t){ const m=(A().start + (t===undefined?S.turn:t)*2) % 1440; return String(Math.floor(m/60)).padStart(2,"0")+":"+String(m%60).padStart(2,"0"); }
function has(i){ return S.items[i]==="inv"; }
function cap(s){ return s.charAt(0).toUpperCase()+s.slice(1); }
function iname(i){ const n=ITEMS[i].name; return typeof n==="function" ? n() : n; }
function list(ids){
  const n=ids.map(iname);
  if(n.length<2) return n.join("");
  return n.slice(0,-1).join(", ")+" and "+n[n.length-1];
}
function fixRoom(id){ const r=FIX[id].room; return typeof r==="function" ? r() : r; }
function fixActive(id){
  const fx=FIX[id];
  if(fx.acts && fx.acts.indexOf(S.act)<0) return false;
  if(fx.cond && !fx.cond()) return false;
  return true;
}
function isLit(){ return S.f.candleLit && (S.items.candle==="inv" || S.items.candle==="cellar"); }
function isDark(){ return S.room==="cellar" && !isLit(); }
function containerOpen(c){
  if(c==="drawer") return S.f.drawerOpen;
  if(c==="pantry") return S.f.pantryOpen;
  if(c==="fridge") return S.f.fridgeOpen;
  if(c==="stand") return true;
  if(c==="safe") return S.act===4 && S.f.safeOpen;
  return false;
}
function visible(){
  const out=[], dark=isDark();
  if(!dark) for(const id in FIX) if(fixActive(id) && fixRoom(id)===S.room) out.push(id);
  for(const id in ITEMS){
    const loc=S.items[id];
    if(loc==="inv") out.push(id);
    else if(dark) continue;
    else if(loc===S.room) out.push(id);
    else if(CROOM[loc]===S.room && containerOpen(loc)) out.push(id);
  }
  return out;
}
function isVisible(id){ return visible().indexOf(id)>=0; }
function here(id){ return fixActive(id) && fixRoom(id)===S.room && !isDark(); }
function esc(s){ return s.replace(/[.*+?^${}()|[\]\\]/g,"\\$&"); }
function find(phrase, pool){
  phrase=phrase.trim(); if(!phrase) return null;
  let best=null, bl=0;
  for(const id of pool){
    for(const a of (ITEMS[id]||FIX[id]).aliases){
      if(phrase===a) return id;
      if(a.length>bl && new RegExp("(^|\\s)"+esc(a)+"($|\\s)").test(phrase)){ best=id; bl=a.length; }
    }
  }
  return best;
}
function resolve(ph, quiet){
  const id=find(ph, visible());
  if(id) return id;
  if(!quiet){
    if(isDark()) say("You can't see a thing. That's sort of the defining feature of the dark.");
    else if(find(ph, ALL)) say("You don't see that here.");
    else say("There's no \""+ph.trim()+"\" here. You may be thinking of a different house.");
  }
  return null;
}
function contents(c, prefix, empty){
  const ins=Object.keys(ITEMS).filter(i=>S.items[i]===c);
  return ins.length ? prefix+list(ins)+"." : empty;
}
function award(key, pts, note){
  if(S.f.scored[key]!==undefined) return;
  S.f.scored[key]=pts; S.score+=pts;
  say("+"+pts+" points"+(note?" · "+note:""), "pts");
}
function penalty(key, pts, note){
  if(S.f.scored[key]!==undefined) return;
  S.f.scored[key]=-pts; S.score-=pts;
  say("−"+pts+" points"+(note?" · "+note:""), "warn");
}
function total(){ return Math.max(0, S.total + S.score); }
function rank(t){
  if(t>=380) return "Apprentice Material, Allegedly";
  if(t>=300) return "Adequate, Per the Cat";
  if(t>=200) return "House-Sitter of Last Resort";
  if(t>=100) return "Liability";
  return "Demon Snack";
}
function pct(){ const t=(S.act===2 && S.f.caughtAt!=null) ? S.f.caughtAt : S.turn; return Math.min(1, t/A().doom); }

/* ================= rooms ================= */
function glow(){
  const p=pct();
  if(S.f.closed) return "dark and entirely ordinary";
  if(p<.25) return "a faint, disapproving violet";
  if(p<.5) return "a steady violet, like a nightlight with opinions";
  if(p<.75) return "a bright violet that throws your shadow up the walls";
  return "a violet so bright it hums in your fillings";
}
function chalk(){
  const p=pct();
  if(S.f.sent) return "The extra chalk has faded to grey dust.";
  if(p<.25) return "Someone has started a second ring around it in fresh chalk: a few neat lines, carefully measured.";
  if(p<.5) return "A second chalk ring is about a third done, very neat, with tiny annotations in the margins.";
  if(p<.75) return "The second chalk ring is more than half finished. Someone has labeled it DRAFT 2.";
  return "The second chalk ring is almost complete, and it's glowing faintly at the joins.";
}
const ROOMS = {
  study:{name:"The Study", exits:{n:"library",w:"greenhouse",e:"kitchen",s:"foyer"}, desc(){
    const f=S.f, ex="\n\nThe library is north, the greenhouse is west, the kitchen is east, and the foyer is south.";
    if(S.act===1){
      let t="The wizard's study. A cluttered desk, an armchair molded to the shape of someone who reads a lot of footnotes, a cold fireplace, and a portrait of the wizard looking disappointed in advance. In the middle of the floor is a chalk summoning circle, glowing "+glow()+".";
      if(!f.mugMoved) t+=" Your coffee mug sits squarely on the edge of the circle, where you put it down as a coaster about an hour ago.";
      else if(!f.saltDone) t+=" There's a coffee-ring-shaped gap in the chalk line. You did that.";
      else if(!f.rootPlaced) t+=" A fresh line of salt closes the gap. The circle hums, offended but whole.";
      else t+=" The circle is whole, and a mandrake root sits at its center, sulking.";
      return t+ex;
    }
    if(S.act===2) return "The study, the afternoon after. The fireplace is cold, the portrait is still disappointed, and the armchair now has a you-shaped dent in it. The circle you closed last night sits quiet in the middle of the floor, salt line intact, mandrake root in the center. "+chalk()+ex;
    if(S.act===3) return "The study, tidied as much as you dared."+(f.rugOnCircle?" A hall rug lies in the middle of the floor, covering the circle completely. It looks deliberate, the way a person standing in front of a hole in the wall looks deliberate.":" The summoning circle is right there in the middle of the floor: chalk, a salt line, a mandrake root, and the remains of an imp's homework. Anyone who knows what they're looking at would know what they're looking at.")+ex;
    let t="The study, Monday morning. The rug still covers the circle. The portrait of Mordrath looks down at you, disappointed, as is its job"+(f.safeFound?". It hangs open on a hinge, showing a small iron safe set into the wall.":", and it's hanging very slightly crooked.");
    if(f.hearing) t+="\n\nThe room is larger than it should be. A bench of black stone has grown out of the floor where the desk was, Judge Mabel presides from the top of it, a gargoyle bailiff guards the fireplace, and Xal'thuun sits at a folding table with his clipboard, beaming.";
    return t+(f.hearing?"\n\nCourt is in session. You're not going anywhere.":ex);
  }},
  kitchen:{name:"Kitchen", exits:{w:"study",s:"cellar"}, desc(){
    const ex="\n\nThe study is west. Narrow stairs lead south and down to the cellar.";
    if(S.act===1) return "A kitchen whose spice rack includes at least three things that are not spices. There's a fridge, a pantry, a drawer, and a stove with a kettle on it. Bartholomew, the wizard's cat, sits on the counter beside "+(S.f.catFed?"a licked-clean bowl, radiating something close to tolerance.":"an empty bowl, radiating grievance.")+ex;
    if(S.act===2) return "The kitchen. A stove, a fridge, a pantry, and a drawer. Bartholomew sits on the counter washing a paw, pointedly not dealing with the intern situation."+ex;
    if(S.act===3) return "The kitchen, scrubbed to a shine you didn't know it had. There's a fridge, a pantry, a drawer, and a stove with a bare ring where the kettle should be. You're hoping nobody notices the bare ring."+ex;
    return "The kitchen. A fridge, a pantry, a drawer, and a kettle-less stove."+(S.f.catRoom==="kitchen"?" Bartholomew sits on the counter wearing your fluffy pink earmuffs, which he has not taken off since yesterday. He seems at peace.":"")+ex;
  }},
  library:{name:"Library", exits:{s:"study"}, desc(){
    let t="Floor-to-ceiling shelves, a rolling ladder, and a reading desk. The books are organized by a system known only to the wizard and possibly the books. Several of them are chained shut, which is never a good sign in a library.";
    if(S.act===2) t+=" One shelf has been reorganized by height, then by color, then by flavor, judging by the bite marks.";
    if(S.act===3 && S.f.catRoom==="library") t+=" At the very top of the ladder, wedged on the highest shelf, two yellow eyes glare down at you. Bartholomew is hiding.";
    return t+"\n\nThe study is south.";
  }},
  greenhouse:{name:"Greenhouse", exits:{e:"study"}, desc(){
    if(S.act===1) return "Humid, green, and loud with the clicking of a Venus flytrap that has clearly been fed something larger than flies. On a bench sits a clay pot "+(S.f.rootTaken?"that is now empty, which you suspect it will hold against you.":"holding a mandrake, its leaves twitching like it's dreaming about screaming.")+" A watering can sits by the door.\n\nThe study is east.";
    return "Humid and green. The clay pot that held the mandrake is empty and resentful. The Venus flytrap looks bigger than it did on Friday, and well fed. A watering can sits by the door.\n\nThe study is east.";
  }},
  foyer:{name:"Foyer", exits:{n:"study",w:"bathroom"}, desc(){
    let t="A narrow entrance hall with a coat rack, an umbrella stand, a mail slot, and a heavy front door covered in runes.";
    if(S.act===1) t+=" You don't read runes, but you get the gist, and the gist is NO.";
    if(S.act===2) t+=" Tiny chalk footprints lead in every direction.";
    if(S.act===3) t+=" The runes, which spent all weekend refusing to let you out, apparently consider mothers welcome at any hour.";
    if(S.act===4) t+=" The runes are flickering nervously, like they've received a letter.";
    return t+"\n\nThe study is north. The bathroom is west.";
  }},
  bathroom:{name:"Bathroom", exits:{e:"foyer"}, desc(){
    let t="Black-and-white tile, a clawfoot tub, a medicine cabinet, and an ornate gilt mirror that watches you walk in with open contempt.";
    if(S.act===2) t+=" The newt in the tub has company: a damp towel the size of a handkerchief and a puddle that smells like struck matches.";
    return t+"\n\nThe foyer is east.";
  }},
  cellar:{name:"Cellar", exits:{n:"kitchen"}, desc(){
    if(isDark()) return "It is pitch black. Something down here drips at irregular intervals, which is somehow worse than regular intervals.\n\nThe stairs lead back up, north.";
    let t="Stone walls, a wine rack, a furnace ticking quietly to itself, and a row of burlap sacks stenciled SALT: FOR WARDING (NOT FOR FRIES). The candle makes the shadows move in ways shadows probably shouldn't.";
    if(S.act>=2) t+=" Through the furnace grate, two coals blink at you. That's Clive. He lives there.";
    return t+"\n\nThe stairs lead back up, north.";
  }}
};
const ROOM_NAMES = {"study":"study","library":"library","kitchen":"kitchen","cellar":"cellar","basement":"cellar","greenhouse":"greenhouse","conservatory":"greenhouse","foyer":"foyer","hall":"foyer","entrance":"foyer","entryway":"foyer","bathroom":"bathroom","loo":"bathroom","toilet":"bathroom","restroom":"bathroom"};

const PIP_DOING = {
  study:"crouched by the circle drawing careful chalk lines, tongue between his teeth",
  library:"reshelving books according to how they taste",
  greenhouse:"arguing with the Venus flytrap and losing",
  kitchen:"trying to open the fridge with a tiny crowbar",
  foyer:"licking the runes on the front door to see what they taste like",
  bathroom:"doing laps in the tub while the newt watches, unimpressed",
  cellar:"warming his hands at the furnace and humming"
};
function npcLines(){
  const f=S.f;
  if(S.act===2 && here("pip")){
    if(f.pipInKettle) say("Pip is in the kettle, eating fudge with both hands. The lid is right there.", "npc");
    else say("Pip the imp is here, "+PIP_DOING[S.room]+".", "npc");
  }
  if(S.act===3 && here("mother")){
    const st = f.stage===0 ? "sitting very upright, waiting for tea and noticing things" : f.stage===1 ? "sipping her tea and eyeing the study door" : "calling for Barty in a voice that could strip varnish";
    say("Mrs. Pennywhistle is here, "+st+".", "npc");
  }
  if(S.act===3 && f.catConvinced && here("cat")) say("Bartholomew is here, wearing your pink earmuffs and an expression of profound sacrifice.", "npc");
  if(S.act===4 && f.catRoom==="study" && here("cat")) say("Bartholomew sits on the edge of the bench, earmuffs on, looking bored by the entire legal system.", "npc");
}
function look(){
  const r=ROOMS[S.room];
  say(isDark()?"Cellar (dark)":r.name, "room");
  say(r.desc());
  if(isDark()) return;
  const hereItems=Object.keys(ITEMS).filter(i=>S.items[i]===S.room && !(i==="mug" && S.act===1 && !S.f.mugMoved));
  if(hereItems.length) say("You can see "+list(hereItems)+" here.");
  for(const c in CROOM){
    if(CROOM[c]!==S.room || !containerOpen(c)) continue;
    const ins=Object.keys(ITEMS).filter(i=>S.items[i]===c);
    if(ins.length) say(cap(CNAME[c])+" holds "+list(ins)+".");
  }
  npcLines();
}

/* ================= describing ================= */
const NOTE_TEXT = "House-sitter,\n\n1. Feed Bartholomew at 8. He will lie and say you didn't.\n2. Water the mandrake. Do NOT pull it.\n3. Do NOT touch the circle in the study.\n4. Help yourself to the fridge, except the jar marked NOT OLIVES.\n\nBack Monday.\n  -M.\n\nP.S. If the circle starts glowing, consult the spellbook.\n     If the spellbook doesn't help, it's probably fine.";
function describe(id){
  const f=S.f, a=S.act;
  switch(id){
    case "mug": return "A mug that says WORLD'S OKAYEST HOUSE-SITTER. It was a gift. You're starting to think it was a warning."+(a===1&&!f.mugMoved?" It's sitting on the chalk line of the circle.":"");
    case "note": return "The wizard's note, in purple ink.";
    case "spellbook":
      if(a===2 && !f.fudgeFound) return "The spellbook, the size of a paving slab. It feels lighter than it did on Friday, and when you tilt it, something shifts inside. You could OPEN it.";
      return "A spellbook the size of a paving slab, bound in something you decide is leather."+(a===2?" Pages 200 to 260 are hollowed out. Of course they are.":" You could READ it.");
    case "portalbook": return "PORTALS: A CAUTIONARY TALE. A loose page sticks out of it as a bookmark. You could READ it.";
    case "candle": return "A fat beeswax candle. "+(f.candleLit?"It's lit, and the flame leans toward the study like it's curious.":"It's unlit.");
    case "matches": return "A box of matches from a tavern called The Drowned Rat. Several are already used. The wizard does not tidy.";
    case "opener": return "A tin opener. The only object in this house without a curse on it, as far as you can tell.";
    case "tin": return "A tin of Sardines of Distinction. "+(f.tinOpen?"It's open, and it smells exactly as distinguished as you'd expect.":"It has no ring pull. Whoever designed it hated you specifically.");
    case "jar": return "A jar marked NOT OLIVES in the wizard's handwriting. They look exactly like olives. They are looking back at you.";
    case "salt": return "A bag of coarse grey warding salt. It's heavier than salt has any right to be.";
    case "earmuffs": return "Fluffy pink earmuffs. On a man who calls himself Mordrath the Unyielding. You file this away.";
    case "root": return "A mandrake root, roughly the shape of a small, furious man. It has stopped screaming and started glaring.";
    case "chopstick": return "A wand. On closer inspection, a chopstick. On even closer inspection, a chopstick with ambitions.";
    case "bestiary": return "A bestiary with a moth-eaten cover and a bookmark at I. You could READ it.";
    case "fudge": return "The wizard's emergency fudge, wrapped in wax paper. "+(f.fudge>1?f.fudge+" squares left.":"One square left.")+" It is very good fudge. You can tell by looking.";
    case "kettle":
      if(f.pipCaught) return "The cast-iron kettle, lid clamped down. It rattles and swears in Infernal. Every so often a tiny voice says \"I want to speak to HR.\"";
      if(f.pipInKettle) return "Pip is inside it, eating fudge with both hands. CLOSE it!";
      if(f.kettleBaited) return "The cast-iron kettle, lid off, a square of fudge inside. It smells irresistible. To you, too, honestly.";
      return "A cast-iron kettle with a heavy lid. It's the heaviest thing in the kitchen that isn't the cat.";
    case "lanyard": f.readLanyard=true; return "A lanyard the length of a bootlace. The card reads: PIP · INTERN (UNPAID) · ACCOUNTS RECEIVABLE · 7TH CIRCLE. On the back: IF FOUND, RETURN TO ACCOUNTS RECEIVABLE.";
    case "teapot": return "The good teapot: bone china, painted with roses, chipped in one place that has been carefully turned to the wall for twenty years. "+(f.brewed?"It's full of hot tea.":f.leaves?"There are leaves in it, but no water.":"It's empty.");
    case "tea": return "A tin labeled TEA in the wizard's handwriting. A rare instance, in this house, of a label meaning what it says.";
    case "nottea": return "A tin marked NOT TEA. It rattles. It also, faintly, whispers.";
    case "saucepan": return "A dented saucepan. It boils water. It does not boil water with dignity."+(f.panHot?" It's full of boiling water right now.":"");
    case "rug": return "A long hall rug in faded reds. It's about the size of a summoning circle, if you squint and are desperate.";
    case "summons": return "A warm envelope that smells of sulfur, from the Infernal Small Claims Court. READ it.";
    case "contract": return "Yellowed parchment with a scorch mark for a seal. "+(f.triplicate?"You have it in triplicate, courtesy of a mirror. ":"")+"READ it.";
    case "quill": return "A black quill with an inkwell built into the shaft. Very convenient. Very ominous.";
    case "paper": return f.agreement ? (f.catSigned ? "The sardine agreement, stamped with an inky paw print." : "The sardine agreement, in your best handwriting, unsigned. You also drew a little fish.") : "A sheet of the wizard's letterhead: MORDRATH THE UNYIELDING, and underneath, in much smaller type, (G. PENNYWHISTLE).";
    case "circle":
      if(a===1){
        let t="A summoning circle drawn in chalk, about two meters across, glowing "+glow()+". ";
        if(!f.mugMoved) t+="Your mug is sitting right on the line. You put it there without looking. You notice, now, that the chalk underneath it is smudged.";
        else if(!f.saltDone) t+="Your mug left a perfect coffee ring through the chalk, breaking the line. Through the gap, faintly, you can hear what sounds like a filing cabinet.";
        else if(!f.rootPlaced) t+="The salt line holds. The center of the circle is empty and seems to be waiting for something.";
        else t+="Whole, rooted, and humming. It needs one more thing, and that thing is a name.";
        return t;
      }
      if(a===2) return "The circle you closed last night. "+chalk()+" In the center, the mandrake root now has a tiny bite mark in it.";
      if(a===3) return f.rugOnCircle ? "Covered by the hall rug. Out of sight, out of mind, and with luck, out of mother." : "Chalk, salt, a mandrake root, and an imp's half-finished homework. To a trained eye, extremely obvious. Mrs. Pennywhistle has a trained eye. She trained Gerald's.";
      return "Under the rug. Let it stay there.";
    case "desk": return a===4 ? "The desk, under more papers than ever."+(S.items.quill==="study"||S.items.paper==="study"?" A quill and some letterhead sit on top, within reach.":"") : "A desk buried in papers: three overdue library notices, a recipe for something called Basilisk Surprise, and a sticky note that just says MONDAY.";
    case "armchair": return "A deep leather armchair with a permanent dent in it. It looks extremely comfortable, which is suspicious given the circumstances.";
    case "fireplace": return "Cold ashes and the remains of what might have been a tax return.";
    case "portrait":
      if(a===4) return f.safeFound ? "The portrait hangs open on its hinge. Mordrath's painted eyes are fixed on the safe with alarm." : "An oil portrait of Mordrath the Unyielding: beard, staff, stern eyes. It's hanging slightly crooked, and the wizard has never let anything in this house hang crooked except his standards. You could look BEHIND it.";
      return "An oil portrait of Mordrath the Unyielding: long beard, stern eyes, a staff, and the expression of a man who expects you to break something. You have.";

    case "judge": return "The Honorable Judge Mabel: a very old toad in a powdered wig, presiding with the patience of something that has been sitting on a log since the Bronze Age.";
    case "xal": return "Xal'thuun of Accounts Receivable: horns, hooves, a short-sleeved dress shirt, a clip-on tie, a lanyard, and a clipboard he holds like a weapon.";
    case "bailiff": return "A gargoyle bailiff. He hasn't moved since he arrived. You suspect he hasn't moved since the cathedral.";
    case "cat":
      if(a===1) return "Bartholomew is a large grey cat with the bearing of a retired judge. "+(f.catFed?"He's fed, which has improved his opinion of you from 'contempt' to 'mild contempt'.":"He's staring at his empty bowl, then at you, then at the bowl, like he's teaching a slow class.");
      if(a===2) return "Bartholomew, washing a paw and very deliberately not looking at anything imp-related.";
      if(a===3) return f.catConvinced ? "Bartholomew in your pink earmuffs. He looks like a cat who has signed a treaty." : "Two yellow eyes at the top of the ladder. Bartholomew is wedged between Hexes, Volume 4 and a stuffed owl, and he is not coming down.";
      return "Bartholomew, wearing pink earmuffs, sitting like a loaf. He has never looked more content or less approachable.";
    case "pip": return "Pip is about the size of a cat: red, tiny horns, a clip-on tie, and the eager face of someone who still believes in the company."+(f.pipInKettle?" He's in the kettle right now. CLOSE it!":"");
    case "mother": return "Mrs. Pennywhistle is small, upright, and wearing a hat with an entire pheasant on it. She has Gerald's eyes, if Gerald's eyes could spot dust from across a room.";
    case "fridge": return f.fridgeOpen ? "The fridge is open and cold and humming. "+contents("fridge","Inside: ","It holds half a lemon and an air of regret.") : "A fridge with a magnet that says I'D RATHER BE TRANSMUTING. It's closed.";
    case "pantry": return f.pantryOpen ? "The pantry is open. "+contents("pantry","Inside: ","Flour, a bag of dried newts, and nothing you need.") : "A tall pantry door, closed.";
    case "drawer": return f.drawerOpen ? "The drawer is open. "+contents("drawer","Inside: ","String, rubber bands, and the spirit of every junk drawer ever.") : "A kitchen drawer. It's closed, and it's that kind of drawer.";
    case "stove": return a===1 ? "A cast-iron stove with a kettle that whistles in a minor key." : a===2 ? "A cast-iron stove." : "A cast-iron stove with a bare ring where the kettle used to sit. The ring looks accusatory.";
    case "oldkettle": return "A cast-iron kettle that whistles in a minor key.";
    case "bowl": return a===1&&!f.catFed ? "An empty cat bowl with BARTHOLOMEW painted on it in gold leaf. The cat's name is better lettered than the wizard's." : "Licked so clean it reflects the ceiling.";
    case "spices": return "Paprika, cumin, something labeled DRAGON (DO NOT), and a jar of what you sincerely hope is cinnamon.";
    case "stairs": return "Narrow stone stairs leading down into the cellar, south of here. It's dark down there.";
    case "shelves": return "Thousands of books. You spot Hexes for Beginners, Hexes for People Who Didn't Read Hexes for Beginners, and Owls: Why?";
    case "readingdesk": return "A reading desk with a brass lamp that has no bulb, only a small, unfriendly flame that won't come out.";
    case "ladder": return "A rolling library ladder."+(a===3&&!f.catConvinced?" At the top, a cat.":" You give it a push. It rolls three feet and stops, unimpressed.");
    case "mandrake": return a===1&&!f.rootTaken ? "A mandrake in a clay pot. Its leaves twitch. Everyone knows mandrakes scream when pulled, and the scream knocks out anyone who hears it. Everyone, presumably, includes you." : "An empty clay pot with a dent in the soil shaped like an accusation.";

    case "mirror": return "An ornate gilt mirror. Your reflection looks tired. The mirror looks tired of you. You could TALK TO it if you want a hint and to feel worse.";

  }

/* ================= shared actions ================= */
function go(d){
  if(S.act===4 && S.f.hearing){ say("The gargoyle bailiff puts one stone hand on your shoulder. You stay."); return 0; }
  if(isDark() && d!=="n"){ say("You take a step into the dark, hit your shin on something that clinks, and decide the stairs back north are your best friend."); return 1; }
  const to=ROOMS[S.room].exits[d];
  if(!to){
    if(S.room==="foyer" && d==="s"){ say(S.act===3 ? "The runes let mothers in. They do not let house-sitters out. You checked." : "You try the front door. The runes flare red and the handle gets very hot. The house has decided you're a burglar. In fairness, you did eat his cheese."); return 0; }
    say("You can't go that way. Walls, mostly."); return 0;
  }
  if(S.act===2 && here("pip") && !S.f.pipInKettle) say("Pip waves goodbye with a piece of chalk.");
  S.room=to; S.g.visited[to]=true;
  look();
  return 1;
}
function goTo(name){
  const t=ROOM_NAMES[name.trim()];
  if(!t){ say("You can't go there. Type MAP if you're lost, which you are."); return 0; }
  if(t===S.room){ say("You're already here. Impressive, in a way."); return 0; }
  const ex=ROOMS[S.room].exits;
  for(const d in ex) if(ex[d]===t) return go(d);
  say("You can't get there directly from here. Type MAP.");
  return 0;
}
function leave(){
  if(S.room==="foyer") return go("s");
  if(isDark()) return go("n");
  const ex=Object.keys(ROOMS[S.room].exits);
  if(ex.length===1) return go(ex[0]);
  say("Which way? N, S, E, or W.");
  return 0;
}
function examine(ph, isRead){
  ph=ph.trim();
  if(/^(around|room|here)$/.test(ph)){ look(); return 0; }
  const id=resolve(ph);
  if(!id) return 0;
  if(id==="note") return readNote();
  if(id==="lanyard"){ say(describe(id)); if(S.act===2) award("lanyard",10,"a return address"); return 0; }
  if(isRead || ["summons","contract","bestiary"].indexOf(id)>=0){
    if(id==="spellbook") return S.act===2 ? openSpellbook() : readSpell();
    if(id==="portalbook") return readPortal();
    if(id==="bestiary") return readBestiary();
    if(id==="summons") return readSummons();
    if(id==="contract") return readContract();
  }
  say(describe(id));
  return 0;
}
function inventory(){
  const inv=Object.keys(ITEMS).filter(has);
  if(!inv.length){ say("You're carrying nothing but regret."); return 0; }
  const lines=inv.map(i=>{
    let n=iname(i);
    if(i==="candle" && S.f.candleLit) n+=" (lit)";
    if(i==="tin" && S.f.tinOpen) n+=" (open)";
    if(i==="earmuffs" && S.f.wearing) n+=" (being worn, regrettably)";
    if(i==="saucepan" && S.f.panHot) n+=" (boiling water)";
    return "  "+n;
  });
  say("You are carrying:\n"+lines.join("\n"));
  return 0;
}

  if(id){ say("It has nothing to say. Most things in this house have something to say, so take the silence as a compliment."); return 0; }
  say("There's nobody here to talk to. Talking to yourself is allowed, but it won't help.");
  return 0;
}

/* ================= combining ================= */
function combine(a, b){
  const x=resolve(a); if(!x) return 0;
  const y=resolve(b); if(!y) return 0;
  const pair=(p,q)=>(x===p&&y===q)||(x===q&&y===p);
  const act=S.act;
  if(act===1){
    if(pair("salt","circle")) return saltCircle();
    if(pair("root","circle")) return placeRoot();
    if(pair("mug","circle")){ say("Absolutely not. You've learned exactly one thing tonight."); return 0; }
    if(pair("opener","tin")) return openTin();
    if(pair("tin","cat") || pair("tin","bowl")) return feedCat();
    if(pair("candle","circle")){ say("You hold the candle over the circle. It casts excellent light on the situation. The situation is still bad."); return 0; }
    if(pair("jar","cat") || pair("jar","bowl")){ say("Bartholomew looks at the jar and then at you. \"Those are someone's,\" he says, and declines to elaborate."); return 0; }
    if(pair("note","fireplace")){ say("Burning the evidence won't close the portal. It's tempting, though."); return 0; }
  }
  if(act===2){
    if(pair("fudge","kettle")) return baitKettle();
    if(pair("kettle","furnace")) return sendKettle();
    if(pair("pip","kettle")){ say("He won't go in for you. He'll go in for fudge."); return 0; }
    if(pair("fudge","pip")){ say("Pip snatches the square of fudge from your hand, eats it in one bite, says \"Thanks, boss!\" and runs off. That was bait. That was your bait."); S.f.fudge--; if(S.f.fudge<=0) S.items.fudge=null; movePip(true); return 1; }
    if(pair("lanyard","furnace")){ say("\"Don't give me the card,\" says Clive. \"SAY the address. I can't read; I'm on fire.\""); return 0; }
  }
  if(act===3){
    if(pair("tea","teapot")) return leavesIn("tea");
    if(pair("nottea","teapot")) return leavesIn("nottea");
    if(pair("saucepan","stove")) return boilWater();
    if(pair("saucepan","teapot")) return pourWater();
    if(pair("teapot","furnace")) return cliveBrew();
    if(pair("teapot","mother")) return serveTea();
    if(pair("rug","circle")) return coverCircle();
    if(pair("earmuffs","cat")) return convinceCat();
    if(pair("jar","mother")){ say("\"My pickled eyes! Why are you handing them to me?\" She puts them back in the fridge herself, frowning."); return 1; }
    if(pair("chopstick","mother")){ say("\"That's a chopstick, dear,\" she says. \"Gerald's been telling people it's a wand since he was nine.\""); return 0; }
    if((pair("tea","mother")||pair("nottea","mother")) && S.f.brewed && has("teapot")) return serveTea();
    if(pair("tea","mother")||pair("nottea","mother")){ say("\"In the POT, dear,\" she says. \"With WATER. Were you raised in a cave?\""); return 0; }
  }
  if(act===4){
    if(pair("contract","mirror")) return triplicate();
    if(pair("paper","cat")) return catSigns();
    if(pair("quill","paper")) return writeAgreement();
    if((pair("contract","judge")||pair("contract","xal")) && S.f.hearing) return hearingPresent("contract");
    if(pair("earmuffs","cat")){ say("He's already wearing them. He may never take them off."); return 0; }
    if(pair("summons","furnace")){ say("\"I'm not burning a court summons,\" says Clive. \"They'll just send another one. On fire.\""); return 0; }
  }
  if(pair("earmuffs","cat")) return convinceCat();
  if(pair("matches","candle")) return lightCandle();
  if(pair("wateringcan","mandrake")) return water();
  if(pair("chopstick","circle")){ say("You wave the wand at the circle. The circle is unmoved. It's a chopstick."); return 1; }
  say("That doesn't do anything useful. Bold idea, though.");
  return 0;
}
function use(a, b){
  if(b) return combine(a, b);
  const id=resolve(a);
  if(!id) return 0;
  const act=S.act;
  switch(id){
    case "salt": return S.room==="study" ? saltCircle() : (say("Use it on what? The circle is in the study."),0);
    case "root": return S.room==="study" ? placeRoot() : (say("Use it on what? The circle is in the study."),0);
    case "matches": case "candle": return lightCandle();
    case "opener": case "tin": return openTin();
    case "earmuffs": return (act===3 && here("cat")) ? convinceCat() : wear();
    case "spellbook": return act===2 ? openSpellbook() : readSpell();
    case "portalbook": return readPortal();
    case "bestiary": return readBestiary();
    case "note": return readNote();
    case "mandrake": return pullMandrake();
    case "wateringcan": return water();
    case "chopstick": say("You wave the wand dramatically. Nothing happens. It's a chopstick. You knew it was a chopstick."); return 1;
    case "armchair": return sit();
    case "mirror": return (act===4 && has("contract")) ? triplicate() : talk(a);
    case "cat": case "mother": case "pip": case "judge": return talk(a);
    case "drawer": case "pantry": case "fridge": case "medcab": return openThing(a);
    case "fudge": return baitKettle();
    case "kettle": return S.f.pipInKettle ? closeKettle() : (act===2 && S.room==="cellar") ? sendKettle() : (say("Bait it, set it down, and wait. That's the bestiary's whole plan."),0);
    case "lanyard": say(describe("lanyard")); return 0;
    case "teapot": return here("mother") ? serveTea() : S.room==="cellar" ? cliveBrew() : (say("Leaves, then hot water, then her. In that order."),0);
    case "saucepan": return S.f.panHot ? pourWater() : boilWater();
    case "rug": return coverCircle();
    case "quill": case "paper": return writeAgreement();
    case "contract": return S.f.hearing ? hearingPresent("contract") : readContract();
    case "summons": return readSummons();
    case "safe": say(S.f.safeOpen?"It's open.":"It wants a name. Not yours."); return 0;
    case "portrait": return act===4 ? behindPortrait() : (say("It's a portrait. You look at it. It looks at you. It wins."),0);
    case "furnace": return act===2 && isVisible("kettle") ? sendKettle() : act===3 && isVisible("teapot") ? cliveBrew() : talk(a);
    case "stove": if(act===3) return boilWater(); say("You light the stove, stare at it, and turn it off. You don't have time for tea."); return 1;
    case "ladder": say(act===3&&!S.f.catConvinced?"You climb halfway up. Bartholomew backs further into the shelf. \"Not without terms,\" he says. \"Or ear protection.\"":"You climb the ladder, look around, and climb down again. That was the whole experience."); return 1;
    case "circle": say("You've used the circle quite enough for one weekend."); return 0;
    case "jar": say("You could eat one. You really, really shouldn't."); return 0;
    case "tub": say("This is not the time for a bath. The newt agrees."); return 0;
  }
  say("You're not sure how to use that. Neither am I.");
  return 0;
}

function tick(n){
  for(let i=0;i<n && !S.over;i++){
    const act=S.act;
    S.turn++;
    if(act===4 && S.f.hearing) continue;
    const v=VOICES[act][S.turn];
    if(v && !(act===1&&S.f.closed) && !(act===2&&S.f.pipCaught)) say(v[1], v[0]);
    if(act===2){
      if(S.f.pipInKettle && ++S.f.eat<3){ if(S.f.eat===2) say("Pip is down to the last bite of fudge.", "warn"); }
      else if(S.f.pipInKettle){
        S.f.pipInKettle=false; S.f.kettleBaited=false;
        say("Pip finishes the fudge, licks his fingers, and climbs out of the kettle. He gives you a little wave on the way out. You've been outplayed by an intern.", "warn");
        movePip(true);
      } else if(S.turn%2===0) movePip(false);
    }
    if(act===3 && S.f.stage===1){ S.f.finish--; if(S.f.finish<=0) momInspects(); if(S.over) return; }
    if(S.act!==act) return;
    if(S.turn>=A().doom && !(act===2 && S.f.pipCaught)){
      if(act===1) doomAct1();
      else if(act===2) doomAct2();
      else if(act===3) doomAct3();
      else if(act===4){ startHearing(); return; }
      return;
    }
  }
}

  say("Speak to the house in short commands:");
  say("LOOK (L)                  describe where you are\nEXAMINE thing (X)         look closely; READ works too\nTAKE / DROP thing\nINVENTORY (I)\nN  S  E  W                 move\nOPEN / CLOSE thing\nUSE thing\nUSE thing ON thing        also PUT thing IN thing, GIVE thing TO someone\nTALK TO someone\nSAY something\nWAIT (Z)\nMAP  HINT  SCORE  SAVE  RESTORE  RETRY  RESTART", "code");
  say("Looking, examining, and meta commands are free. Everything else costs two minutes. Each act has its own deadline. Four acts, 100 points each.", "sys");
  return 0;
}
function score(){
  const prev=[1,2,3].filter(n=>S.g.actScores[n]!==undefined).map(n=>"Act "+ROMAN[n]+" "+S.g.actScores[n]);
  say("Act "+ROMAN[S.act]+": "+Math.max(0,S.score)+" of 100 so far. Total: "+total()+" of 400."+(prev.length?" ("+prev.join(", ")+")":"")+" It's "+A().day+" "+clock()+". Current standing: "+rank(total())+".");
  return 0;
}
function showMap(){
  const W=12;
  const nm=(id,label)=> S.g.visited[id] ? (S.room===id?"["+label+"]":label) : "?????";
  const c=t=>{ const p=Math.max(0,W-t.length), l=Math.floor(p/2); return " ".repeat(l)+t+" ".repeat(p-l); };
  const gap="    ", link=" -- ";
  const rows=[
    c("")+gap+c(nm("library","LIBRARY")),
    c("")+gap+c("|"),
    c(nm("greenhouse","GREENHOUSE"))+link+c(nm("study","STUDY"))+link+c(nm("kitchen","KITCHEN")),
    c("")+gap+c("|")+gap+c("|"),
    c(nm("bathroom","BATHROOM"))+link+c(nm("foyer","FOYER"))+gap+c(nm("cellar","CELLAR"))
  ];
  say(rows.map(r=>r.replace(/\s+$/,"")).join("\n"), "map");
  say("Brackets mark where you are. Question marks are rooms you haven't been brave enough to visit.", "sys");
  return 0;
}
function save(){
  try{ localStorage.setItem(SAVE_KEY, JSON.stringify({S, checkpoint})); say("Game saved in this browser.", "sys"); }
  catch(e){ say("Couldn't save. This browser is blocking storage for this page.", "sys"); }
  return 0;
}
function restore(){
  let raw=null;
  try{ raw=localStorage.getItem(SAVE_KEY); }catch(e){ raw=null; }
  if(!raw){ say("No saved game found in this browser.", "sys"); return 0; }
  try{ const d=JSON.parse(raw); S=d.S; checkpoint=d.checkpoint; }catch(e){ say("That save is corrupted. Much like the circle was.", "sys"); return 0; }
  say("Saved game restored. "+ACTS[S.act].title+", "+A().day+" "+clock()+".", "sys");
  look();
  return 0;
}
function retry(){
  if(!checkpoint){ say("There's nothing to retry yet.", "sys"); return; }
  S=clone(checkpoint);
  say("Rewinding to the start of "+ACTS[S.act].title+".", "sys");
  actBanner(S.act);
}

/* ================= parser ================= */
const HUH = ["I don't know that verb. Neither, I suspect, do you.","That's not something you can do here. I checked.","Bold. Incomprehensible, but bold.","The house doesn't understand you. Join the club.","Try saying that again, but as a sentence a person would type."];
function dispatch(s){
  let m;
  const f=S.f, act=S.act;
  if(/^(help|\?|commands|h)$/.test(s)) return help();
  if(/^(hint|hints|stuck|clue)$/.test(s)) return hint();
  if(/^(score|points)$/.test(s)) return score();
  if(/^(map|m)$/.test(s)) return showMap();
  if(s==="save") return save();
  if(/^(restore|load)$/.test(s)) return restore();
  if(/^(restart|new game|reset|start over)$/.test(s)){ newGame(); return 0; }
  if(/^(retry|retry act|replay)$/.test(s)){ retry(); return 0; }
  if(/^(i|inv|inventory|items|pockets)$/.test(s)) return inventory();
  if(/^(l|look|look around|where am i)$/.test(s)){ look(); return 0; }
  if(/^wait\s+(?:for|until|till)\s+(?:hearing|court|9|09:00|nine)/.test(s) && act===4 && !f.hearing){ say("You sit down and wait for your court date, the way nobody ever should."); return A().doom - S.turn; }
  if(/^(wait|z|idle)(\s+(for\s+.+|here|around))?$/.test(s)){ say(act===1?"You wait. The circle doesn't.":act===2?"You wait, very still, trying to look like furniture.":act===3?"You wait. Somewhere, Mrs. Pennywhistle is finding dust.":"You wait. Time passes at its usual legal rate."); return 1; }
  if(/^(x|examine|read|take|get|open|use|drop|say)$/.test(s)){ say(cap(s)+" what?"); return 0; }

  // hearing mode
  if(act===4 && f.hearing){
    if((m=s.match(/^(?:present|file|submit|show|hand|give|offer|enter|produce|exhibit)\s+(.+?)(?:\s+to\s+.+)?$/))){
      if(/^(me|myself|my soul|self)$/.test(m[1])) return proBono();
      return hearingPresent(m[1]);
    }
    if((m=s.match(/^(?:call|summon|bring|fetch|nominate|name)\s+(.+)$/))) return hearingCall(m[1]);
    if(/^(object|objection)/.test(s)){ say("\"Overruled,\" croaks Judge Mabel. \"You haven't said anything yet.\""); return 0; }
    if(/^(plead|argue|appeal|beg)/.test(s)){ say("\"The court doesn't want speeches,\" croaks the judge. \""+(f.hstage===1?"It wants the CONTRACT.":"It wants to know WHO PAYS.")+"\""); return 0; }
  }

  // easter eggs
  if(s==="xyzzy"||s==="plugh"){ say("A hollow voice says: \"Wrong house.\""); return 0; }
  if(/^(sleep|nap|rest|lie down)\b/.test(s)){ say("Absolutely not. You'd wake up to a demon making toast."); return 0; }
  if(/\b(fuck|shit|damn|hell|crap|bloody)\b/.test(s) && !(act===2 && f.cliveAsk && S.room==="cellar")){ say("The portrait looks scandalized. It has heard worse. It has said worse."); return 0; }
  if(/^(pray)\b/.test(s)){ say("In this house? Bold."); return 0; }
  if(/^(dance)\b/.test(s)){ say("You do a small, joyless dance. The portrait's eyes follow you, which they were doing already."); return 1; }
  if(/^(cast|spell|magic|enchant|conjure)\b/.test(s)){ say("You wiggle your fingers and say something vaguely Latin. You are not a wizard. You are a person who used a summoning circle as a coaster."); return 0; }
  if(/^(phone|text)\b/.test(s)){ say("Your phone has no signal. The wards eat it. You do have 4% battery, which feels symbolic."); return 0; }
  if(/^(kick|punch|hit|smash|break|attack|throw)\b/.test(s)){ say("Violence won't help. Also, everything in this house is either cursed or expensive."); return 0; }
  if(/^(win|cheat|god mode|iddqd)$/.test(s)){ say("That's not how wizardry works. Or games."); return 0; }
  if(/^(gerald|say gerald|shout gerald|speak gerald|state gerald)$/.test(s)) return speakName();

  // movement
  if((m=s.match(/^(?:go |walk |head |run |move |travel )?(n|north|s|south|e|east|w|west)$/))) return go(m[1][0]);
  if(/^(?:go |walk |head )?(d|down|downstairs)$/.test(s)){ if(S.room==="kitchen") return go("s"); say("There's no down from here, except emotionally."); return 0; }
  if(/^(?:go |walk |head )?(u|up|upstairs)$/.test(s)){ if(S.room==="cellar") return go("n"); say("There's no upstairs. The wizard keeps saying he'll add one."); return 0; }
  if(/^(out|leave|exit|back|go back|go out|outside|escape)$/.test(s)) return leave();
  if((m=s.match(/^(?:go|walk|head|run|enter|travel)\s+(?:to\s+|into\s+|in\s+|down to\s+)?(.+)$/))) return goTo(m[1]);

  // looking
  if((m=s.match(/^(?:look|check|search|peek|peer)\s+behind\s+(.+)$/))){
    const id=resolve(m[1]); if(!id) return 0;
    if(id==="portrait") return behindPortrait();
    say("Nothing behind it but more house."); return 0;
  }
  if((m=s.match(/^(?:move|lift|swing|tilt|straighten|adjust)\s+(?:portrait|painting|picture)$/))) return behindPortrait();
  if((m=s.match(/^(?:look|check|search|peek)\s+(?:under|beneath|below|underneath)\s+(.+)$/))){
    const id=resolve(m[1]); if(!id) return 0;
    if(id==="mug" && act===1) return take("mug");
    if(id==="rug" && act===3){ say("Under the rug: the circle. That's the point."); return 0; }
    if(id==="armchair"){ say("Under the armchair: a sock, two buttons, and a tiny skeleton of something you decide was a mouse."+(act===2?" Also chalk dust. A lot of chalk dust.":"")); return 0; }
    if(id==="desk"){ say("More papers. The wizard has never thrown anything away, including, possibly, a previous house-sitter."); return 0; }
    say("Nothing interesting under there."); return 0;
  }
  if((m=s.match(/^(?:look|check|peek)\s+(?:in|inside|into)\s+(.+)$/)) || (m=s.match(/^(?:search|rummage)\s+(?:through\s+|in\s+)?(.+)$/))){
    const id=resolve(m[1]); if(!id) return 0;
    if(id==="spellbook" && act===2) return openSpellbook();
    if(["drawer","pantry","fridge","medcab"].indexOf(id)>=0 && (id==="medcab" || !containerOpen(id))) return openThing(m[1]);
    say(describe(id)); return 0;
  }
  if((m=s.match(/^read\s+(.+)$/))) return examine(m[1], true);
  if((m=s.match(/^(?:x|examine|inspect|look at|check|describe|study|view|look|l|check out|observe)\s+(.+)$/))) return examine(m[1]);

  // speech
  if((m=s.match(/^(?:say|speak|shout|whisper|yell|chant|intone|utter|announce|call out|state|tell clive|tell furnace)\s+(.+)$/))){
    const arg=m[1].replace(/["']/g,"").trim();
    if(arg.indexOf(NAME)>=0) return speakName();
    if(act===2 && f.cliveAsk && S.room==="cellar") return sayAddress(arg);
    if(/mordrath/.test(arg)){ say(act===4&&S.room==="study"&&f.safeFound&&!f.safeOpen?"You say \"Mordrath.\" The safe makes a noise like a scoff. That's his stage name.":"You say \"Mordrath.\" Nothing happens. That's his stage name."); return 1; }
    if(/(please|sorry)/.test(arg)){ say("You apologize to the room. The room does not accept."); return 1; }
    if(/(abracadabra|alakazam|hocus|open sesame|expelliarmus|bibbidi)/.test(arg)){ say("You say \""+arg+"\" with feeling. Nothing happens, which is a fair review."); return 1; }
    say("You say \""+arg+"\" out loud. Nothing happens. The portrait seems to sigh.");
    return 1;
  }
  if(act===2 && f.cliveAsk && S.room==="cellar" && /(accounts receivable|seventh circle|7th circle)/.test(s)) return sayAddress(s);

  // act I verbs
  if(/^(?:feed|give food to)\s+(?:cat|bartholomew|him|kitty|barty)/.test(s) || /^feed$/.test(s)) return feedCat();
  if(/^(?:wear|put on|don)\s+/.test(s) || /^put\s+(?:earmuffs|muffs|ear muffs)\s+on$/.test(s)) return wear();
  if(/^(?:remove|take off|doff)\s+(?:earmuffs|muffs|ear muffs)$/.test(s)) return unwear();
  if((m=s.match(/^(?:pull|uproot|yank|pluck|harvest|dig up|pick)\s+(?:up\s+)?(.+)$/)) && /(mandrake|root|plant|pot)/.test(m[1])) return pullMandrake();
  if(/^(?:water|irrigate)\b/.test(s)) return water();
  if(/^(?:light|ignite|burn)\s+(?:candle|wick|taper)/.test(s) || /^strike\s+(?:match|matches)/.test(s)) return lightCandle();
  if(/^(?:blow out|extinguish|snuff|douse|put out|pinch out)\s*(?:candle|flame|light)?$/.test(s)) return douse();
  if(/^(?:fix|repair|mend|seal|restore|complete)\s+(?:circle|gap|ring|portal)$/.test(s)){
    if(act!==1){ say("The circle is fine. It's everything else that's broken."); return 0; }
    if(has("salt")) return saltCircle();
    if(f.saltDone && has("root")) return placeRoot();
    if(f.saltDone && f.rootPlaced){ say("All that's left is the name."); return 0; }
    say("You'll need more than good intentions. Read the instructions. There are always instructions.");
    return 0;
  }
  if(/salt/.test(s) && /^(?:pour|sprinkle|spread|scatter|salt)\b/.test(s) && act===1) return saltCircle();
  if(/^(?:plant|place|set|put)\s+(?:root|mandrake root|mandrake)\b/.test(s) && S.room==="study" && act===1) return placeRoot();
  if(/^(?:sit|sit down|sit in|sit on|relax)\b/.test(s)) return sit();
  if((m=s.match(/^(?:wave|flick|swish)\s+(.+)$/))){ const id=resolve(m[1]); if(!id) return 0; if(id==="chopstick"){ say("Swish and flick. Nothing. It is, and has always been, a chopstick."); return 1; } say("You wave it around. Nothing happens. Anyone watching is embarrassed for you."); return 1; }
  if(/^open\s+(?:tin|sardines|tin of sardines)(?:\s+with\s+.+)?$/.test(s) && act===1) return openTin();
  if(/^(?:scoop|get|grab|take)\s+salt/.test(s)) return take("salt");

  // act II verbs
  if(act===2){
    if(/^(?:catch|grab|seize|nab|trap|get|take|chase|pounce on)\s+(?:pip|imp|intern)/.test(s)) return grabPip();
    if(/^(?:close|shut|cover|clamp|slam|lid)\s*(?:kettle|lid|kettle lid|trap)?$/.test(s) || /^put\s+lid\s+on/.test(s)) return closeKettle();
    if(/^(?:bait|load)\s+(?:kettle|trap)/.test(s)) return baitKettle();
    if(/^(?:set|place|put down|lay|put)\s+(?:kettle|trap)(?:\s+down)?$/.test(s)) return drop("kettle");
    if(/^(?:send|mail|post|forward|ship)\s+/.test(s)) return sendKettle();
  }
  // act III verbs
  if(act===3){
    if(/^(?:compliment|flatter|praise|admire)\b/.test(s)) return compliment();
    if(/^(?:tell|confess|explain|admit)\b/.test(s) && here("mother") && /(portal|demon|imp|circle|summon|everything|truth|kettle|hell)/.test(s)){
      loss("Full Disclosure","You tell her everything: the coaster, the circle, the demon, the intern, the kettle, the furnace. She listens without interrupting. Then she opens her handbag, takes out a compact mirror, and says very calmly into it: \"Gerald Pennywhistle.\"\n\nHonesty, it turns out, is the best policy for everyone except you.");
      return 0;
    }
    if(/^(?:boil|heat)\s+(?:water|saucepan|pan)/.test(s)) return boilWater();
    if(/^(?:make|brew)\s+(?:tea|pot of tea|cup of tea|cuppa)/.test(s)){
      if(!f.leaves){ say("Tea leaves in the teapot first. PUT TEA IN TEAPOT."); return 0; }
      if(!f.brewed){ if(S.room==="cellar") return cliveBrew(); if(f.panHot) return pourWater(); say("You need boiling water, and the kettle is in Hell. Saucepan, or someone with a talent for fire."); return 0; }
      say("It's brewed. SERVE TEA."); return 0;
    }
    if(/^(?:serve|offer)\s+(?:tea|teapot|cup|her)/.test(s) || /^pour\s+(?:tea|cup)/.test(s) || /^serve$/.test(s)) return serveTea();
    if(/^pour\s+(?:water|saucepan|pan|boiling water)/.test(s)) return pourWater();
    if(/^(?:cover|hide|conceal|disguise)\s+(?:circle|evidence|floor|salt|chalk|it)/.test(s)) return coverCircle();
    if(/^(?:climb|climb up|ascend)\b/.test(s) && S.room==="library") return use("ladder");
  }
  // act IV verbs
  if(act===4){
    if(/^(?:write|draft|compose|scribble|draw up)\b/.test(s)) return writeAgreement();
    if(/^(?:copy|duplicate|photocopy|reproduce)\s+/.test(s)){ if(S.room==="bathroom" && has("contract")) return triplicate(); say("There's no copier in a wizard's house. There is a mirror that thinks very highly of its reflections, in the bathroom."); return 0; }
    if(/^(?:sign)\b/.test(s)){ say("It's not your soul on the line. Well. Not yet. It's the cat's signature you need."); return 0; }
    if((m=s.match(/^(?:call|summon|fetch)\s+(.+)$/))) return hearingCall(m[1]);
  }

  // generic
  if((m=s.match(/^(?:take|get|grab|pick up|pickup|steal|collect|snag|lift)\s+(.+?)(?:\s+(?:from|out of|off)\s+.+)?$/))) return take(m[1]);
  if((m=s.match(/^(?:drop|discard|put down|throw away|toss)\s+(.+)$/))) return drop(m[1]);
  if((m=s.match(/^(?:open|unlock)\s+(.+)$/))) return openThing(m[1]);
  if((m=s.match(/^(?:close|shut)\s+(.+)$/))) return closeThing(m[1]);
  if((m=s.match(/^(?:eat|consume|devour|bite|taste|lick)\s+(.+)$/))) return eat(m[1]);
  if((m=s.match(/^(?:drink|sip)\s*(.*)$/))){ say(act===3&&isVisible("teapot")&&f.brewed?"That's her tea. Touch it and die.":has("mug")?"Your mug is empty. That's how all this started: you put it down to go refill it.":"There's nothing to drink that isn't labeled with a skull."); return 0; }
  if((m=s.match(/^(?:talk|talk to|speak to|speak with|ask|hello|hi|hey|greet|chat with|tell|question|wake|wake up|pet|stroke)\b\s*(.*)$/))){
    if(/^(pet|stroke)/.test(s) && here("cat")){ say("You reach out to pet Bartholomew. He allows it for exactly one stroke, then looks at your hand like it owes him money."); return 1; }
    return talk(m[1]);
  }
  if((m=s.match(/^(?:give|offer|hand|show|present)\s+(.+?)\s+to\s+(.+)$/))) return combine(m[1], m[2]);
  if((m=s.match(/^(?:put|insert|place|load|stick|set|pour|sprinkle|spread|lay)\s+(.+?)\s+(?:in|into|inside|on|onto|in to|at|over|across)\s+(.+)$/))) return combine(m[1], m[2]);
  if((m=s.match(/^(?:hold|hold up)\s+(.+?)\s+(?:to|up to|in front of)\s+(.+)$/))) return combine(m[1], m[2]);
  if((m=s.match(/^(?:use|apply|operate)\s+(.+?)(?:\s+(?:on|with|in|into|at)\s+(.+))?$/))) return use(m[1], m[2]);
  if((m=s.match(/^(?:turn|switch)\s+(?:on|off)\s+(.+)$/))){ say("Nothing in this house has a switch. That's the whole aesthetic."); return 0; }

  say(HUH[f.huh++ % HUH.length]+" Type HELP for the basics.", "sys");
  return 0;
}

function clean(raw){
  return raw.toLowerCase()
    .replace(/[^a-z0-9!:'\- ]/g," ")
    .replace(/\b(the|an|some|my|your|please|that|this)\b/g," ")
    .replace(/(^|\s)a(?=\s)/g," ")
    .replace(/\s+/g," ")
    .trim();
}
function handle(raw){
  const s=clean(raw);
  if(!s) return;
  say("> "+raw.trim(), "echo");
  if(S.over){
    if(/^(restart|new game|play again|reset|start over)$/.test(s)){ newGame(); render(); return; }
    if(S.retry && /^(retry|again|r|yes|y|replay|retry act)$/.test(s)){ retry(); render(); return; }
    if(/^(restore|load)$/.test(s)){ restore(); render(); return; }
    if(/^(score|points)$/.test(s)){ say("Final total: "+total()+" of 400 · "+rank(total()), "sys"); render(); return; }
    say(S.retry ? "This act is over. Type RETRY to replay it, RESTART to go back to Friday, or RESTORE to load a save." : "That's the end. Type RESTART to play again.", "sys");
    render(); return;
  }
  const r=dispatch(s);
  if(typeof r==="number" && r>0 && !S.over) tick(r);
  render();
}
function newGame(){
  S={act:1, room:"study", turn:0, score:0, total:0, over:false, retry:false, items:{}, f:{}, g:{visited:{}, ateJar:false, stunned:false, watered:false, actScores:{}}};
  buffer=[];
  if(HAS_DOM){ const log=document.getElementById("log"); if(log) log.textContent=""; }
  say("THE WIZARD IS OUT", "title");
  say("A text adventure in four acts of poor house-sitting.", "sub");
  setupAct(1);
  actBanner(1);
}

/* ================= UI ================= */
function status(){
  if(!HAS_DOM) return;
  const set=(id,v,cls)=>{ const el=document.getElementById(id); el.textContent=v; el.className=cls||""; };
  const f=S.f, act=S.act;
  set("st-act", ROMAN[act]);
  set("st-loc", isDark() ? "Cellar (dark)" : ROOMS[S.room].name.replace(/^The /,""));
  set("st-time", A().day+" "+clock());
  set("st-score", total()+"/400");
  let o="", oc="";
  if(act===1){ if(f.closed){o="Circle closed";oc="good";} else if(f.saltDone&&f.rootPlaced){o="Say the name";oc="good";} else if(f.saltDone){o="Circle mended";} else {o="Circle broken";oc="hot";} }
  if(act===2){ if(f.sent){o="Imp returned";oc="good";} else if(f.pipCaught){o="Imp in kettle";oc="good";} else if(f.pipInKettle){o="CLOSE KETTLE";oc="hot";} else if(f.kettleBaited){o="Trap baited";} else {o="Imp loose";oc="hot";} }
  if(act===3){ o = f.done ? "She's gone" : f.stage===0 ? "Make tea" : f.stage===1 ? (f.rugOnCircle?"Find the cat":"Hide the circle") : "Fetch Barty"; oc = f.done?"good":(f.stage===1&&!f.rugOnCircle?"hot":""); }
  if(act===4){ if(f.hearing){ o = "Strikes "+f.strikes+"/3"; oc = f.strikes>=2?"hot":""; } else { const done=[f.triplicate, f.catSigned].filter(Boolean).length; o="Prep "+done+"/2"; oc=done===2?"good":""; } }
  set("st-obj", o, oc);
  document.getElementById("st-meter-label").textContent = A().meter;
  const el=document.getElementById("st-meter");
  el.innerHTML="";
  let n=10, on=0, hot=false, label="";
  if(act===3){ n=3; on=f.susp; hot=f.susp>=2; label="Suspicion "+f.susp+" of 3"; }
  else if(act===1){ const p=f.closed?0:pct(); on=Math.ceil(p*10); hot=p>=.7; label="Portal "+Math.round(p*100)+" percent open"; }
  else if(act===2){ const p=f.sent?0:pct(); on=Math.ceil(p*10); hot=p>=.7; label="Second circle "+Math.round(p*100)+" percent drawn"; }
  else { const p=f.hearing?1:pct(); on=Math.ceil(p*10); hot=p>=.7; label=f.hearing?"Hearing in session":"Hearing in "+((A().doom-S.turn)*2)+" minutes"; }
  for(let i=0;i<n;i++){ const seg=document.createElement("i"); if(i<on) seg.className="on"; el.appendChild(seg); }
  el.className="meter"+(n===3?" wide":"")+(hot?" hot":"");
  el.setAttribute("aria-label", label);
}
function render(){
  if(!HAS_DOM) return;
  const log=document.getElementById("log");
  let first=null;
  for(const l of buffer){
    const d=document.createElement("div");
    d.className="line"+(l.cls?" "+l.cls:"");
    d.textContent=l.t;
    log.appendChild(d);
    if(!first) first=d;
  }
  buffer=[];
  while(log.children.length>900) log.removeChild(log.firstChild);
  if(first){
    const tall = log.scrollHeight - first.offsetTop > log.clientHeight;
    log.scrollTop = tall ? Math.max(0, first.offsetTop-12) : log.scrollHeight;
  }
  status();
}
function start(data){
  if(data && data.S && data.S.g){ S=data.S; checkpoint=data.checkpoint||clone(S); buffer=[]; say("Session resumed. "+ACTS[S.act].title+", "+A().day+" "+clock()+".", "sys"); look(); }
  else newGame();
  render();
}

if(HAS_DOM){
  const form=document.getElementById("cmd");
  const input=document.getElementById("cmd-input");
  const hist=[]; let hi=0;
  form.addEventListener("submit", e=>{
    e.preventDefault();
    const v=input.value;
    if(!v.trim()) return;
    hist.push(v); hi=hist.length;
    input.value="";
    handle(v);
  });
  input.addEventListener("keydown", e=>{
    if(e.key==="ArrowUp"){ if(hi>0){ hi--; input.value=hist[hi]; e.preventDefault(); } }
    else if(e.key==="ArrowDown"){ if(hi<hist.length-1){ hi++; input.value=hist[hi]; } else { hi=hist.length; input.value=""; } e.preventDefault(); }
  });
  document.querySelectorAll(".chips button").forEach(b=>{
    b.addEventListener("click", ()=>{
      handle(b.dataset.cmd);
      if(window.matchMedia && window.matchMedia("(pointer:fine)").matches) input.focus();
    });
  });
  try{ window.claude && window.claude.hot && window.claude.hot.snapshot && window.claude.hot.snapshot(()=>({S, checkpoint})); }catch(e){}
  const hot=window.claude && window.claude.hot;
  if(hot && hot.ready) hot.ready(start); else start(hot && hot.data ? hot.data : {});
  if(window.matchMedia && window.matchMedia("(pointer:fine)").matches) input.focus();
} else {
  globalThis.__game={ handle, newGame, state:()=>S, out:()=>{ const b=buffer; buffer=[]; return b; } };
}
})();
</script>
